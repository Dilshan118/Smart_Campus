spring.application.name=smart-campus-operation-hub
spring.config.import=optional:file:.env[.properties]

# Database Connection — Neon PostgreSQL (loaded from .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (Optimized for serverless Neon Postgres & Railway)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# Time to wait for a connection before throwing a timeout exception (30 seconds)
spring.datasource.hikari.connection-timeout=30000
# Keep idle connections alive by sending a heartbeat ping every 30 seconds
# (Prevents Neon from suspending compute and keeps connections warm)
spring.datasource.hikari.keepalive-time=30000
# Maximum time a connection can remain idle before being retired (10 minutes)
spring.datasource.hikari.idle-timeout=600000
# Maximum lifetime of a connection in the pool (30 minutes)
spring.datasource.hikari.max-lifetime=1800000
# How long a connection can be out of the pool before a leak warning is printed (20 seconds)
spring.datasource.hikari.leak-detection-threshold=20000

# H2 Console (disabled in production, enable for local-only debugging)
spring.h2.console.enabled=false

# Spring Data JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.web.resources.static-locations=file:uploads/,classpath:/static/

server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:smartCampusJwtSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2026}
jwt.expiration-ms=86400000

# Frontend URL (for OAuth2 redirect)
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Google OAuth2 (set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in .env)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
